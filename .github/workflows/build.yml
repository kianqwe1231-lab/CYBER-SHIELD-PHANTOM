name: Build CYBER-SHIELD PHANTOM APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          if [ ! -d "$SDK_ROOT/cmdline-tools" ]; then
            echo "::error::Android SDK command-line tools directory not found: $SDK_ROOT/cmdline-tools"
            ls -la "$SDK_ROOT" || true
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager executable not found"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager || true
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK and capture diagnostics
        shell: bash
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace --info --console=plain 2>&1 | tee build.log
          result=${PIPESTATUS[0]}
          echo "GRADLE_EXIT_CODE=$result" | tee -a build.log
          echo ""
          echo "========== GRADLE ERROR SUMMARY =========="
          grep -n -A 8 -B 3 -E "What went wrong:|Execution failed for task|^e: |error:|Could not resolve|Could not find|Compilation error|Unresolved reference" build.log | tail -n 100 || true
          echo "========== END ERROR SUMMARY ============="
          exit "$result"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CYBER-SHIELD-PHANTOM-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CYBER-SHIELD-PHANTOM-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
