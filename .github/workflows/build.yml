name: Build CYBER-SHIELD PHANTOM APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android packages
        run: |
          sdkmanager --list
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK and capture diagnostics
        shell: bash
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace --info --console=plain 2>&1 | tee build.log
          result=${PIPESTATUS[0]}
          echo "GRADLE_EXIT_CODE=$result" | tee -a build.log
          exit "$result"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CYBER-SHIELD-PHANTOM-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CYBER-SHIELD-PHANTOM-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
