name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        shell: bash
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee build.log
          result=${PIPESTATUS[0]}
          echo "========== GRADLE ERROR SUMMARY =========="
          grep -ni -A 8 -B 4 -E "FAILURE:|What went wrong:|Execution failed|^e: |error:|Could not resolve|Could not find|Unresolved reference" build.log | tail -n 120 || true
          echo "========== LAST LOG LINES ================"
          tail -n 100 build.log
          exit "$result"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CyberShield-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CyberShield-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
