name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "Gradle wrapper not found; installing Gradle 8.7"
            sudo apt-get update
            sudo apt-get install -y gradle
            gradle --no-daemon assembleDebug
          fi

      - name: Show APK output
        if: always()
        shell: bash
        run: |
          find app/build/outputs -type f -name "*.apk" -print 2>/dev/null || true

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CyberShield-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
